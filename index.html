<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>私人健康仪表盘</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211b;
      --muted: #5e6b63;
      --line: #d9e1db;
      --paper: #f6f3ec;
      --panel: rgba(255, 255, 255, 0.82);
      --accent: #217a4b;
      --danger: #b84a3a;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 10%, rgba(56, 131, 86, 0.20), transparent 30%),
        linear-gradient(135deg, #fbfaf5 0%, var(--paper) 48%, #e7efe8 100%);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    main {
      width: min(440px, 100%);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 20px 60px rgba(38, 54, 42, 0.14);
      backdrop-filter: blur(16px);
    }
    .kicker {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    p {
      margin: 14px 0 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }
    form {
      display: grid;
      gap: 12px;
      margin-top: 22px;
    }
    label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 13px 14px;
      background: #fffdf8;
      color: var(--ink);
      font: inherit;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(33, 122, 75, 0.14);
    }
    button {
      border: 0;
      border-radius: 6px;
      padding: 13px 16px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      cursor: progress;
      opacity: 0.72;
    }
    .status {
      min-height: 22px;
      margin-top: 12px;
      color: var(--danger);
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Encrypted Local Decryption</p>
    <h1>私人健康仪表盘</h1>
    <p>此页面只保存加密后的仪表盘数据。输入你的本地密码后，浏览器会在本机解密并打开。</p>
    <form id="unlockForm">
      <label for="password">访问密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
      <button id="unlockButton" type="submit">解锁</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </main>

    function fromBase64(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    function concatBytes(left, right) {
      const result = new Uint8Array(left.length + right.length);
      result.set(left, 0);
      result.set(right, left.length);
      return result;
    }

    async function deriveKey(password) {
      const baseKey = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: fromBase64(PAYLOAD.salt),
          iterations: PAYLOAD.iterations,
          hash: "SHA-256"
        },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decryptDashboard(password) {
      const key = await deriveKey(password);
      const encrypted = concatBytes(fromBase64(PAYLOAD.ciphertext), fromBase64(PAYLOAD.tag));
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromBase64(PAYLOAD.iv) },
        key,
        encrypted
      );
      return new TextDecoder().decode(decrypted);
    }

    document.getElementById("unlockForm").addEventListener("submit", async event => {
      event.preventDefault();
      const status = document.getElementById("status");
      const button = document.getElementById("unlockButton");
      const password = document.getElementById("password").value;
      status.textContent = "";
      button.disabled = true;
      button.textContent = "解锁中";
      try {
        const html = await decryptDashboard(password);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        status.textContent = "密码不正确，或发布文件已损坏。";
        button.disabled = false;
        button.textContent = "解锁";
      }
    });
